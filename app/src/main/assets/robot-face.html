<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Face</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent !important;
    overflow: hidden;
  }
  .mini-orb {
    position: relative;
    width: 100px;
    height: 100px;
    animation: float 3.2s ease-in-out infinite;
  }
  .orb {
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(180,140,255,0.95), rgba(90,40,200,0.6) 40%, rgba(20,10,40,0.95) 75%);
    box-shadow:
      0 0 45px 8px rgba(124,58,237,0.65),
      0 0 90px 18px rgba(59,130,246,0.3),
      inset 0 0 35px rgba(0,0,0,0.6);
    animation: pulse 2.4s ease-in-out infinite, breathe 3.2s ease-in-out infinite;
    overflow: hidden;
  }
  .orb::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 180deg, rgba(124,58,237,0.9), rgba(59,130,246,0.9), rgba(180,120,255,0.9), rgba(124,58,237,0.9));
    -webkit-mask: radial-gradient(circle, transparent 63%, black 64%, black 78%, transparent 79%);
    mask: radial-gradient(circle, transparent 63%, black 64%, black 78%, transparent 79%);
    animation: spin 4s linear infinite;
  }
  .orb::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, transparent 0%, transparent 55%, rgba(10,5,20,0.85) 62%, rgba(10,5,20,0.95) 100%);
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 45px 8px rgba(124,58,237,0.65), 0 0 90px 18px rgba(59,130,246,0.3), inset 0 0 35px rgba(0,0,0,0.6); }
    50% { box-shadow: 0 0 65px 14px rgba(124,58,237,0.9), 0 0 120px 28px rgba(59,130,246,0.45), inset 0 0 35px rgba(0,0,0,0.6); }
  }
  .orb-face {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 10px;
    z-index: 2;
    animation: sway 3.2s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: translate(-50%, -50%) translateX(0); }
    25% { transform: translate(-50%, -50%) translateX(-3px); }
    75% { transform: translate(-50%, -50%) translateX(3px); }
  }
  .orb-eye {
    width: 8px;
    height: 22px;
    border-radius: 6px;
    background: linear-gradient(180deg, #ffd9f7, #e879f9);
    box-shadow: 0 0 16px 4px rgba(232,121,249,0.95);
    animation: blink 3s infinite, glow 2.4s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes blink {
    0%, 88%, 100% { transform: scaleY(1); }
    92% { transform: scaleY(0.15); }
    96% { transform: scaleY(1); }
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 16px 4px rgba(232,121,249,0.95); }
    50% { box-shadow: 0 0 26px 8px rgba(232,121,249,1); }
  }
</style>
</head>
<body>
  <div class="mini-orb">
    <div class="orb">
      <div class="orb-face">
        <div class="orb-eye"></div>
        <div class="orb-eye"></div>
      </div>
    </div>
  </div>
</body>
</html>
